<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ロシア語単語帳</title>
  <meta name="theme-color" content="#fff7ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="露単語">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="stats">
      <div class="known">覚えた単語 <b id="known">0</b><small> / <span id="total">0</span></small></div>
      <div class="checking">確認中 <span id="checking">0</span>語</div>
    </header>
    <div id="stage" class="stage">
      <div id="card" class="card" role="button" tabindex="0" aria-label="タップして裏返す">
        <div class="face front">
          <span id="badge" class="badge" hidden></span>
          <button class="speak" aria-label="読み上げ">🔊</button>
          <div id="pic" class="pic" aria-hidden="true"></div>
          <div id="ru" class="ru"></div>
          <p id="hint" class="hint">タップして裏返す</p>
        </div>
        <div class="face back">
          <button class="speak" aria-label="読み上げ">🔊</button>
          <div id="ru-small" class="ru-small"></div>
          <div id="ja" class="ja"></div>
          <div id="example" class="example">
            <div id="ex-ru" class="ex-ru"></div>
            <div id="ex-ja" class="ex-ja"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="buttons" class="buttons">
      <button id="btn-again" class="btn again">まだ</button>
      <button id="btn-good" class="btn good">覚えた</button>
      <button id="btn-known" class="btn known-btn">知ってる</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
